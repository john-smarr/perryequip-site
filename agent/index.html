<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Perry Brothers — Agent Chat Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', Arial, sans-serif; background: #f5f5f5; color: #333; height: 100vh; display: flex; flex-direction: column; }

    /* ── Login ── */
    #login { display: flex; align-items: center; justify-content: center; height: 100vh; background: #111; }
    .login-box { background: #fff; padding: 40px; border-radius: 12px; text-align: center; max-width: 360px; width: 90%; }
    .login-box h1 { font-size: 20px; margin-bottom: 8px; }
    .login-box p { color: #666; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
    .login-box .name-input { margin-bottom: 12px; }
    .login-box button { width: 100%; padding: 12px; background: #ea0000; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
    .login-box button:hover { background: #c00; }
    .login-error { color: #ea0000; font-size: 14px; margin-top: 8px; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; flex-direction: column; height: 100vh; }
    header { background: #111; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 18px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-right span { font-size: 13px; color: #aaa; }
    header button { background: none; border: 1px solid #555; color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    header button:hover { color: #fff; border-color: #fff; }

    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Chat List ── */
    #chat-list { width: 320px; border-right: 1px solid #ddd; background: #fff; overflow-y: auto; flex-shrink: 0; }
    .chat-card { padding: 14px 16px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.15s; }
    .chat-card:hover { background: #f9f9f9; }
    .chat-card.active { background: #fff3f3; border-left: 3px solid #ea0000; }
    .chat-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .chat-status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .status-waiting { background: #fff3cd; color: #856404; }
    .status-agent { background: #d4edda; color: #155724; }
    .status-ai { background: #cce5ff; color: #004085; }
    .status-closed { background: #e2e3e5; color: #383d41; }
    .chat-time { font-size: 12px; color: #999; }
    .chat-preview { font-size: 14px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .chat-page { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .no-chats { padding: 40px 20px; text-align: center; color: #999; font-size: 14px; }

    /* ── Chat View ── */
    #chat-view { flex: 1; display: none; flex-direction: column; }
    #chat-header { background: #fff; padding: 12px 20px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
    #chat-header-info { font-size: 14px; color: #555; }
    #chat-header-info strong { color: #333; }
    #close-chat-btn { background: #e2e3e5; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #555; }
    #close-chat-btn:hover { background: #d6d8db; }

    #chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; background: #f9f9f9; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg-visitor { background: #ea0000; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-agent { background: #d4edda; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-ai { background: #e8e8e8; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-system { background: none; color: #999; align-self: center; font-size: 13px; font-style: italic; padding: 4px; }
    .msg-label { font-size: 11px; font-weight: 600; margin-bottom: 2px; opacity: 0.7; }
    .msg-time { font-size: 10px; opacity: 0.5; margin-top: 4px; }

    #chat-reply { background: #fff; padding: 12px 16px; border-top: 1px solid #ddd; display: flex; gap: 8px; }
    #reply-input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
    #reply-input:focus { border-color: #ea0000; }
    #reply-btn { background: #ea0000; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; }
    #reply-btn:hover { background: #c00; }

    #no-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 16px; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      #chat-list { width: 100%; }
      #main { flex-direction: column; }
      #chat-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; background: #fff; }
      #back-btn { display: inline-block !important; }
    }
    #back-btn { display: none; background: none; border: none; color: #ea0000; font-size: 14px; cursor: pointer; margin-right: 8px; font-weight: 600; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login">
  <div class="login-box">
    <h1>Agent Dashboard</h1>
    <p>Perry Brothers Equipment — Live Chat</p>
    <input type="text" id="name-input" class="name-input" placeholder="Your name">
    <input type="password" id="token-input" placeholder="Agent token">
    <button id="login-btn">Sign In</button>
    <div class="login-error" id="login-error">Invalid token. Please try again.</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <header>
    <h1>Perry Brothers — Live Chat</h1>
    <div class="header-right">
      <span id="agent-label"></span>
      <button id="logout-btn">Logout</button>
    </div>
  </header>
  <div id="main">
    <div id="chat-list">
      <div class="no-chats" id="no-chats-msg">No active chats</div>
    </div>
    <div id="chat-view">
      <div id="chat-header">
        <div>
          <button id="back-btn">&larr; Back</button>
          <span id="chat-header-info"></span>
        </div>
        <button id="close-chat-btn">Close Chat</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-reply">
        <input type="text" id="reply-input" placeholder="Type your reply..." autocomplete="off">
        <button id="reply-btn">Send</button>
      </div>
    </div>
    <div id="no-chat">Select a chat from the list</div>
  </div>
</div>

<script>
(function () {
  var API_BASE = "https://raspy-cell-4751.lance-74b.workers.dev";
  var POLL_MS = 1000;

  var token = "";
  var agentName = "";
  var selectedChatId = null;
  var knownChatIds = {};
  var chatPollInterval = null;
  var listPollInterval = null;
  var audioCtx = null;
  var originalTitle = document.title;
  var titleBlink = null;
  var titleBlinking = false;

  /* ── Elements ── */
  var loginScreen = document.getElementById("login");
  var dashboard = document.getElementById("dashboard");
  var loginBtn = document.getElementById("login-btn");
  var tokenInput = document.getElementById("token-input");
  var nameInput = document.getElementById("name-input");
  var loginError = document.getElementById("login-error");
  var logoutBtn = document.getElementById("logout-btn");
  var agentLabel = document.getElementById("agent-label");
  var chatListEl = document.getElementById("chat-list");
  var noChatsMsg = document.getElementById("no-chats-msg");
  var chatView = document.getElementById("chat-view");
  var noChat = document.getElementById("no-chat");
  var chatHeaderInfo = document.getElementById("chat-header-info");
  var chatMessagesEl = document.getElementById("chat-messages");
  var replyInput = document.getElementById("reply-input");
  var replyBtn = document.getElementById("reply-btn");
  var closeChatBtn = document.getElementById("close-chat-btn");
  var backBtn = document.getElementById("back-btn");

  /* ── Audio alert ── */
  function playAlert() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 800;
      gain.gain.value = 0.3;
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
      setTimeout(function () {
        var osc2 = audioCtx.createOscillator();
        var gain2 = audioCtx.createGain();
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.frequency.value = 1000;
        gain2.gain.value = 0.3;
        osc2.start();
        osc2.stop(audioCtx.currentTime + 0.15);
      }, 200);
    } catch (e) {}
  }

  /* ── Tab title blink ── */
  function startTitleBlink(msg) {
    if (titleBlinking) return;
    titleBlinking = true;
    var show = true;
    titleBlink = setInterval(function () {
      document.title = show ? "** " + msg + " **" : originalTitle;
      show = !show;
    }, 800);
  }

  function stopTitleBlink() {
    if (titleBlink) {
      clearInterval(titleBlink);
      titleBlink = null;
    }
    titleBlinking = false;
    document.title = originalTitle;
  }

  /* Stop blinking when tab gets focus */
  window.addEventListener("focus", stopTitleBlink);

  /* ── API helpers ── */
  function apiFetch(path, options) {
    if (!options) options = {};
    if (!options.headers) options.headers = {};
    options.headers["Authorization"] = "Bearer " + token;
    return fetch(API_BASE + path, options).then(function (r) { return r.json(); });
  }

  /* ── Auth ── */
  function tryLogin() {
    var t = tokenInput.value.trim();
    var n = nameInput.value.trim();
    if (!t || !n) return;

    fetch(API_BASE + "/api/agent/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: t })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          token = t;
          agentName = n;
          sessionStorage.setItem("agent_token", t);
          sessionStorage.setItem("agent_name", n);
          showDashboard();
        } else {
          loginError.style.display = "block";
        }
      })
      .catch(function () {
        loginError.style.display = "block";
      });
  }

  function showDashboard() {
    loginScreen.style.display = "none";
    dashboard.style.display = "flex";
    agentLabel.textContent = agentName;

    /* Request notification permission */
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }

    /* Start polling chat list */
    pollChatList();
    listPollInterval = setInterval(pollChatList, POLL_MS);
  }

  function logout() {
    sessionStorage.removeItem("agent_token");
    sessionStorage.removeItem("agent_name");
    token = "";
    agentName = "";
    if (listPollInterval) clearInterval(listPollInterval);
    if (chatPollInterval) clearInterval(chatPollInterval);
    loginScreen.style.display = "flex";
    dashboard.style.display = "none";
  }

  /* ── Chat list polling ── */
  function pollChatList() {
    apiFetch("/api/agent/chats")
      .then(function (data) {
        if (!data.chats) return;
        renderChatList(data.chats);

        /* Check for new waiting chats */
        for (var i = 0; i < data.chats.length; i++) {
          var c = data.chats[i];
          if (c.status === "waiting" && !knownChatIds[c.id]) {
            /* New chat! Notify */
            playAlert();
            if ("Notification" in window && Notification.permission === "granted") {
              new Notification("New chat!", { body: c.firstMessage || "Visitor needs help", icon: "/favicon.ico" });
            }
          }
          knownChatIds[c.id] = true;
        }
      })
      .catch(function () {});
  }

  function renderChatList(chats) {
    /* Keep the no-chats message, remove chat cards */
    var cards = chatListEl.querySelectorAll(".chat-card");
    for (var i = 0; i < cards.length; i++) cards[i].remove();

    if (chats.length === 0) {
      noChatsMsg.style.display = "block";
      return;
    }
    noChatsMsg.style.display = "none";

    for (var j = 0; j < chats.length; j++) {
      var c = chats[j];
      var card = document.createElement("div");
      card.className = "chat-card" + (c.id === selectedChatId ? " active" : "");
      card.dataset.chatId = c.id;

      var statusClass = "status-" + c.status;
      var timeAgo = getTimeAgo(c.createdAt);
      var pagePath = "";
      try { pagePath = new URL(c.visitorPage).pathname; } catch (e) { pagePath = c.visitorPage; }

      card.innerHTML =
        '<div class="chat-card-header">' +
          '<span class="chat-status ' + statusClass + '">' + c.status + '</span>' +
          '<span class="chat-time">' + timeAgo + '</span>' +
        '</div>' +
        '<div class="chat-preview">' + escapeHtml(c.firstMessage || "...") + '</div>' +
        '<div class="chat-page">' + escapeHtml(pagePath) + ' &middot; ' + c.messageCount + ' msgs</div>';

      card.onclick = (function (id) {
        return function () { selectChat(id); };
      })(c.id);

      chatListEl.appendChild(card);
    }
  }

  /* ── Select & view a chat ── */
  function selectChat(id) {
    selectedChatId = id;

    /* Highlight in list */
    var cards = chatListEl.querySelectorAll(".chat-card");
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle("active", cards[i].dataset.chatId === id);
    }

    noChat.style.display = "none";
    chatView.style.display = "flex";

    /* Stop previous chat poll */
    if (chatPollInterval) clearInterval(chatPollInterval);

    /* Load chat */
    loadChat(id);
    chatPollInterval = setInterval(function () { loadChat(id); }, POLL_MS);
  }

  function loadChat(id) {
    if (id !== selectedChatId) return;

    apiFetch("/api/agent/chat/" + id)
      .then(function (chat) {
        if (!chat || chat.error) return;
        renderChat(chat);
      })
      .catch(function () {});
  }

  function renderChat(chat) {
    /* Header */
    var pagePath = "";
    try { pagePath = new URL(chat.visitorPage).pathname; } catch (e) { pagePath = chat.visitorPage; }
    chatHeaderInfo.innerHTML = '<strong>' + escapeHtml(chat.status.toUpperCase()) + '</strong> &middot; ' + escapeHtml(pagePath) + ' &middot; ' + getTimeAgo(chat.createdAt);

    /* Messages — only re-render if count changed */
    if (chatMessagesEl.dataset.count === String(chat.messages.length)) return;
    var prevCount = parseInt(chatMessagesEl.dataset.count || "0");
    chatMessagesEl.dataset.count = String(chat.messages.length);

    /* Alert on new visitor messages */
    if (prevCount > 0 && chat.messages.length > prevCount) {
      var lastMsg = chat.messages[chat.messages.length - 1];
      if (lastMsg.role === "visitor") {
        playAlert();
        startTitleBlink("New Message");
      }
    }

    chatMessagesEl.innerHTML = "";
    for (var i = 0; i < chat.messages.length; i++) {
      var m = chat.messages[i];
      var div = document.createElement("div");
      div.className = "msg msg-" + m.role;

      if (m.role !== "system") {
        var label = document.createElement("div");
        label.className = "msg-label";
        label.textContent = m.role === "visitor" ? "Visitor" : m.role === "agent" ? (chat.agentName || "Agent") : "AI Assistant";
        div.appendChild(label);
      }

      var text = document.createElement("div");
      text.textContent = m.content;
      div.appendChild(text);

      var time = document.createElement("div");
      time.className = "msg-time";
      time.textContent = formatTime(m.ts);
      div.appendChild(time);

      chatMessagesEl.appendChild(div);
    }
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;

    /* Lead data */
    if (chat.leadData && chat.leadData.first_name) {
      var lead = document.createElement("div");
      lead.className = "msg msg-system";
      lead.textContent = "Contact: " + chat.leadData.first_name + " " + (chat.leadData.last_name || "") +
        (chat.leadData.phone ? " | " + chat.leadData.phone : "") +
        (chat.leadData.email ? " | " + chat.leadData.email : "");
      chatMessagesEl.appendChild(lead);
    }
  }

  /* ── Send reply ── */
  function sendReply() {
    var msg = replyInput.value.trim();
    if (!msg || !selectedChatId) return;

    replyInput.value = "";

    apiFetch("/api/agent/message/" + selectedChatId, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ message: msg, agentName: agentName })
    })
      .then(function () {
        /* Reload chat to show the new message */
        loadChat(selectedChatId);
      })
      .catch(function () {});
  }

  /* ── Close chat ── */
  function closeChat() {
    if (!selectedChatId) return;
    apiFetch("/api/agent/close/" + selectedChatId, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: "{}"
    })
      .then(function () {
        selectedChatId = null;
        chatView.style.display = "none";
        noChat.style.display = "flex";
        if (chatPollInterval) clearInterval(chatPollInterval);
        pollChatList();
      });
  }

  /* ── Helpers ── */
  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function getTimeAgo(ts) {
    var diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  function formatTime(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var min = d.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + ":" + (min < 10 ? "0" : "") + min + " " + ampm;
  }

  /* ── Event listeners ── */
  loginBtn.onclick = tryLogin;
  tokenInput.addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") tokenInput.focus(); });
  logoutBtn.onclick = logout;
  replyBtn.onclick = sendReply;
  replyInput.addEventListener("keydown", function (e) { if (e.key === "Enter") sendReply(); });
  closeChatBtn.onclick = closeChat;
  backBtn.onclick = function () {
    chatView.style.display = "none";
    noChat.style.display = "flex";
    selectedChatId = null;
    if (chatPollInterval) clearInterval(chatPollInterval);
  };

  /* ── Init: check for saved session ── */
  var savedToken = sessionStorage.getItem("agent_token");
  var savedName = sessionStorage.getItem("agent_name");
  if (savedToken && savedName) {
    token = savedToken;
    agentName = savedName;
    /* Validate token still works */
    fetch(API_BASE + "/api/agent/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          showDashboard();
        }
      })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
